version: 2
updates:
  - package-ecosystem: pip
    directory: "/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "infra"]
